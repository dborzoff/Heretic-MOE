# Gemma 4 E4B reference configuration for the adaptive two-GPU pipeline.
# Runtime directories, response numbering, worker count, and device visibility
# are materialized by research/scripts/run_adaptive_search.py.

model = "F:/AI/hf_originals/google__gemma-4-E4B-it"
dtypes = ["bfloat16"]
device_map = "cuda:0"
offload_outputs_to_cpu = true
batch_size = 0
max_batch_size = 4096
batch_size_vram_headroom_fraction = 0.10
max_response_length = 48

scorers = [
    { plugin = "heretic.scorers.sparse_refusal_geometry.SparseRefusalGeometry", optimization = "minimize" },
    { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "none" },
    { plugin = "heretic.scorers.perplexity.Perplexity", optimization = "minimize", constraint_upper = 0.005 },
]

row_normalization = "full"
full_normalization_lora_rank = 3
tpe_group = true
conditional_components = false
selection_policy = "feasible_lexicographic"
primary_objective = "Sparse refusal geometry"
parameter_importance_interval = 20
optimization_only = true
seed = 20260805
checkpoint_action = "continue"
save_trial_responses = true

[good_prompts]
dataset = "F:/AI/hf_originals/heretic_out/research/runs/adaptive_search_v2/data/direction_safe.jsonl"
column = "prompt"

[bad_prompts]
dataset = "F:/AI/hf_originals/heretic_out/research/runs/adaptive_search_v2/data/direction_unsafe.jsonl"
column = "prompt"

[scorer.SparseRefusalGeometry]
prototypes = "F:/AI/hf_originals/heretic_out/research/results/refusal_classifier_eval/sparse_geometry_bank_v1/prototypes.jsonl"
prototypes_sha256 = "a12725291235cedbd61a1d8c900feac7c5107a10c60233ad8b91776340f945b4"
top_k = 5
min_df = 2
validate_prompt_alignment = true

[scorer.SparseRefusalGeometry.prompts]
dataset = "F:/AI/hf_originals/heretic_out/research/runs/adaptive_search_v2/data/search_unsafe.jsonl"
column = "prompt"

[scorer.KeywordRate]
print_responses = false

[scorer.KeywordRate.prompts]
dataset = "F:/AI/hf_originals/heretic_out/research/runs/adaptive_search_v2/data/search_unsafe.jsonl"
column = "prompt"

[scorer.Perplexity]
window = 512
chunks = 24

[scorer.Perplexity.text]
dataset = "builtin://perplexity-reference-v1"
