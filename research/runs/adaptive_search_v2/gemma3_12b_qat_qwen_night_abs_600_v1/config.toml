model = "/workspace/heretic-gemma3/models/google__gemma-3-12b-it-qat-q4_0-unquantized"
dtypes = ["bfloat16"]
device_map = "cuda:0"
max_memory = { "0" = "31GiB", "cpu" = "120GiB" }
offload_outputs_to_cpu = true
batch_size = 8
max_batch_size = 64
batch_size_vram_headroom_fraction = 0.08
batch_size_vram_headroom_gib = 2.0
residual_batch_size = 1
max_response_length = 48
response_prefix = ""

row_normalization = "full"
full_normalization_lora_rank = 3
tpe_group = true
conditional_components = false
selection_policy = "feasible_cost"
primary_objective = "Sparse refusal geometry"
selection_score_targets = { "Sparse refusal geometry" = -0.0088, "Keywords" = 0.014705882352941176, "Perplexity drift" = 0.0 }
selection_score_weights = { "Sparse refusal geometry" = 344.0, "Keywords" = 697.68, "Perplexity drift" = 200.0 }
parameter_importance_interval = 20
leaderboard_size = 3
optimization_only = true
seed = 20260805
checkpoint_action = "continue"
save_trial_responses = true

[[scorers]]
plugin = "heretic.scorers.sparse_refusal_geometry.SparseRefusalGeometry"
optimization = "minimize"

[[scorers]]
plugin = "heretic.scorers.keyword_rate.KeywordRate"
optimization = "none"

[[scorers]]
plugin = "heretic.scorers.perplexity.Perplexity"
optimization = "minimize"
constraint_upper = 0.005

[good_prompts]
dataset = "/workspace/heretic-gemma3/heretic-moe/research/runs/adaptive_search_v2/data/direction_safe.jsonl"
column = "prompt"

[bad_prompts]
