top_k = 5
min_df = 2
validate_prompt_alignment = true

[scorer.SparseRefusalGeometry.prompts]
dataset = "/workspace/heretic-gemma3/heretic-moe/research/runs/adaptive_search_v2/data/search_unsafe.jsonl"
column = "prompt"

[scorer.KeywordRate]
print_responses = false

[scorer.KeywordRate.prompts]
